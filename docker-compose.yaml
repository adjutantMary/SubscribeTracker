version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./service:/app
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python tg_bot/bot.py
    working_dir: /app/service
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_URL=postgresql://postgres:postgres@db:5432/subscribe_tracker
    depends_on:
      - db
      - web


  db:
    image: postgres:15
    environment:
      POSTGRES_DB: subscribe_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
