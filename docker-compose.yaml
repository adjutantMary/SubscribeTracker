version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./service:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  bot:
    build:
      context: .
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    working_dir: /tg_bot
    volumes:
      - ./service:/tg_bot
    env_file:
      - .env
    environment:
      - DB_URL=postgresql://postgres:postgres@db:5432/subscribe_tracker
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: subscribe_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
